{% extends "base.html" %}

{% block title %}Add Ticket - Ticket Management System{% endblock %}

{% block content %}
<div class="row">
    <div class="col-12">
        <h1 class="mb-4">
            <i class="fas fa-plus me-2"></i>Add a New Ticket
        </h1>
        <p class="text-muted">Fill out the form below with the ticket details.</p>
    </div>
</div>

<div class="card">
    <div class="card-body">
        <form method="POST" enctype="multipart/form-data">
            <div class="row">
                <div class="col-md-4">
                    <div class="mb-3">
                        <label for="first_name" class="form-label">First Name *</label>
                        <input type="text" class="form-control" id="first_name" name="first_name" maxlength="50" required>
                    </div>
                    <div class="mb-3">
                        <label for="middle_name" class="form-label">Middle Name</label>
                        <input type="text" class="form-control" id="middle_name" name="middle_name" maxlength="50">
                    </div>
                    <div class="mb-3">
                        <label for="last_name" class="form-label">Last Name *</label>
                        <input type="text" class="form-control" id="last_name" name="last_name" maxlength="50" required>
                    </div>
                </div>
                
                <div class="col-md-4">
                    <div class="mb-3">
                        <label for="court_date" class="form-label">Court Date</label>
                        <input type="date" class="form-control" id="court_date" name="court_date">
                    </div>
                    <div class="mb-3">
                        <label for="reminder_days_before" class="form-label">Remind me (days before court date)</label>
                        <input type="number" class="form-control" id="reminder_days_before" name="reminder_days_before" min="0" max="90" value="20">
                    </div>
                    <div class="mb-3">
                        <label for="reminder_email" class="form-label">Reminder Email</label>
                        <input type="email" class="form-control" id="reminder_email" name="reminder_email" placeholder="recipient@example.com">
                    </div>
                    <div id="smtp_settings_group" style="display:none;">
                        <div class="mb-3">
                            <label for="smtp_server" class="form-label">SMTP Server</label>
                            <input type="text" class="form-control" id="smtp_server" name="smtp_server" value="smtp.gmail.com">
                        </div>
                        <div class="mb-3">
                            <label for="smtp_port" class="form-label">SMTP Port</label>
                            <input type="number" class="form-control" id="smtp_port" name="smtp_port" value="587">
                        </div>
                        <div class="mb-3">
                            <label for="smtp_username" class="form-label">SMTP Username (Gmail address)</label>
                            <input type="text" class="form-control" id="smtp_username" name="smtp_username" placeholder="your@gmail.com">
                        </div>
                        <div class="mb-3">
                            <label for="smtp_password" class="form-label">SMTP Password (App password)</label>
                            <input type="password" class="form-control" id="smtp_password" name="smtp_password" placeholder="App password">
                        </div>
                    </div>
                    <div class="mb-3">
                        <label for="citation_date" class="form-label">Citation Date</label>
                        <input type="date" class="form-control" id="citation_date" name="citation_date">
                    </div>
                    <div class="mb-3">
                        <label for="contact_date" class="form-label">Contact Date</label>
                        <input type="date" class="form-control" id="contact_date" name="contact_date">
                    </div>
                </div>
                
                <div class="col-md-4">
                    <div class="mb-3">
                        <label for="ticket_type" class="form-label">Ticket Type</label>
                        <input type="text" class="form-control" id="ticket_type" name="ticket_type" maxlength="50">
                    </div>
                    <div class="mb-3">
                        <label for="county" class="form-label">County</label>
                        <input type="text" class="form-control" id="county" name="county" maxlength="50">
                    </div>
                    <div class="mb-3">
                        <label for="court" class="form-label">Court</label>
                        <input type="text" class="form-control" id="court" name="court" maxlength="100">
                    </div>
                </div>
            </div>
            
            <div class="row">
                <div class="col-12">
                    <div class="mb-3">
                        <label for="notes" class="form-label">Notes</label>
                        <textarea class="form-control" id="notes" name="notes" rows="3"></textarea>
                    </div>
                </div>
            </div>
            
            <div class="row">
                <div class="col-md-6">
                    <div class="mb-3">
                        <label for="source" class="form-label">Source</label>
                        <input type="text" class="form-control" id="source" name="source" maxlength="100">
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="mb-3">
                        <label for="other" class="form-label">Other</label>
                        <input type="text" class="form-control" id="other" name="other" maxlength="100">
                    </div>
                </div>
            </div>
            
            <div class="row">
                <div class="col-12">
                    <div class="mb-3">
                        <label for="ticket_image" class="form-label">Upload Ticket Image</label>
                        <input type="file" class="form-control" id="ticket_image" name="ticket_image" accept="image/*">
                        <div class="form-text">Supported formats: JPG, PNG, JPEG</div>
                    </div>
                </div>
            </div>
            
            <div class="row">
                <div class="col-12">
                    <button type="submit" class="btn btn-primary btn-lg">
                        <i class="fas fa-save me-2"></i>Submit Ticket
                    </button>
                    <a href="{{ url_for('dashboard') }}" class="btn btn-secondary btn-lg ms-2">
                        <i class="fas fa-times me-2"></i>Cancel
                    </a>
                </div>
            </div>
        </form>
    </div>
</div>
{% endblock %} 

{% block scripts %}
<script>
// Show/hide SMTP fields if reminder email is set
function toggleSmtpFields() {
    var email = document.getElementById('reminder_email').value;
    var group = document.getElementById('smtp_settings_group');
    if (email) {
        group.style.display = '';
        document.getElementById('smtp_server').required = true;
        document.getElementById('smtp_port').required = true;
        document.getElementById('smtp_username').required = true;
        document.getElementById('smtp_password').required = true;
    } else {
        group.style.display = 'none';
        document.getElementById('smtp_server').required = false;
        document.getElementById('smtp_port').required = false;
        document.getElementById('smtp_username').required = false;
        document.getElementById('smtp_password').required = false;
    }
}
document.getElementById('reminder_email').addEventListener('input', toggleSmtpFields);
document.addEventListener('DOMContentLoaded', function() {
    toggleSmtpFields();
});
</script>
{% endblock %}
