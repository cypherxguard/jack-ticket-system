{% extends "base.html" %}

{% block title %}Login - Ticket Management System{% endblock %}

{% block auth_content %}
<div class="row justify-content-center align-items-center min-vh-100">
    <div class="col-md-6 col-lg-4">
        <div class="card shadow-lg">
            <div class="card-body p-5">
                <div class="text-center mb-4">
                    <i class="fas fa-ticket-alt fa-3x text-primary mb-3"></i>
                    <h2 class="card-title">Ticket Management System</h2>
                    <p class="text-muted">Please log in to continue</p>
                </div>
                
                <form method="POST">
                    <div class="mb-3">
                        <label for="username" class="form-label">Username</label>
                        <div class="input-group">
                            <span class="input-group-text">
                                <i class="fas fa-user"></i>
                            </span>
                            <input type="text" class="form-control" id="username" name="username" required>
                        </div>
                    </div>
                    
                    <div class="mb-4">
                        <label for="password" class="form-label">Password</label>
                        <div class="input-group">
                            <span class="input-group-text">
                                <i class="fas fa-lock"></i>
                            </span>
                            <input type="password" class="form-control" id="password" name="password" required>
                        </div>
                    </div>
                    
                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary btn-lg">
                            <i class="fas fa-sign-in-alt me-2"></i>Login
                        </button>
                    </div>
                </form>
                
                <div class="text-center mt-4">
                    <small class="text-muted">
                        <strong>Available Accounts:</strong><br>
                        Username: <code>jack</code> | Password: <code>admin123</code><br>
                        Username: <code>admin</code> | Password: <code>securepass</code>
                    </small>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
